# wpp-mcp with Docker Compose.
#
# First run:
#   mkdir -p data secrets
#   (umask 077; docker run --rm ghcr.io/murandido/mcp-wpp:latest keygen -out - > secrets/wpp_mcp_key)
#   # back up secrets/wpp_mcp_key: without it data/ cannot be read
#   docker compose up -d
#   docker compose exec wpp-mcp wpp-mcp pair -phone +<number>
#   docker compose exec wpp-mcp wpp-mcp access list
#
# MCP clients on the host connect with:
#   docker compose exec -T wpp-mcp wpp-mcp stdio
# or over HTTP at http://127.0.0.1:8765/mcp with the token in data/store/token.

services:
  wpp-mcp:
    image: ghcr.io/murandido/mcp-wpp:${WPP_MCP_TAG:-latest}
    build:
      context: .
      # The .git directory is not in the build context, so pass the version:
      #   WPP_MCP_VERSION=$(git describe --tags --always) docker compose build
      args:
        VERSION: ${WPP_MCP_VERSION:-dev}
    restart: unless-stopped
    # Run as your own user so the bind-mounted data and the 0600 key file are
    # readable; set WPP_UID/WPP_GID if yours are not 1000.
    user: "${WPP_UID:-1000}:${WPP_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Publish on the host's loopback only. The daemon still requires the
    # bearer token and rejects non-loopback Host/Origin headers.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
    secrets:
      - wpp_mcp_key
    environment:
      WPP_MCP_STORE: /data/store
      WPP_MCP_KEY_FILE: /run/secrets/wpp_mcp_key
      # WPP_MCP_WRITE: "1"          # allow sends (each one still waits for your approval)
      # WPP_MCP_RETAIN_DAYS: "90"   # delete cached messages older than 90 days
      # WPP_MCP_PAIR_PHONE: "+5511999999999"  # print a pairing code on first start
      # OAuth for remote connectors such as claude.ai, behind an HTTPS proxy that
      # forwards /mcp, /.well-known/oauth-* and /oauth/* (README: Connect with OAuth):
      # WPP_MCP_OAUTH: "1"
      # WPP_MCP_PUBLIC_URL: https://wpp.example.com
      # Local transcription with the whisper service below (profile transcribe):
      # voice notes are transcribed on this host for chat notes and
      # transcribe_audio, and never leave it.
      # WPP_MCP_TRANSCRIBE_URL: http://whisper:8080
      # WPP_MCP_TRANSCRIBE_ALLOW_PRIVATE_HTTP: "1"
    networks: [default, stt]

  # Optional local speech-to-text: whisper.cpp built from a pinned commit with
  # a SHA-256-verified model (deploy/whisper/Dockerfile). Build it on this
  # host, then start it:
  #   docker compose --profile transcribe build whisper
  #   docker compose --profile transcribe up -d
  # It sits on an internal network with no internet access and no published
  # port; only wpp-mcp reaches it. Uploaded audio is held in tmpfs (memory).
  whisper:
    profiles: [transcribe]
    build: ./deploy/whisper
    image: wpp-mcp-whisper:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [stt]
    # Threads used per transcription (one at a time); 2 suits a small VPS.
    command: ["--threads", "${WHISPER_THREADS:-2}"]
    mem_limit: 1g

networks:
  # Internal: no route to the internet, only between wpp-mcp and whisper.
  stt:
    internal: true

secrets:
  wpp_mcp_key:
    file: ./secrets/wpp_mcp_key
