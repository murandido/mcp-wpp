version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(docker)" }
    # A new Go minor (1.26 -> 1.27) must move together with the toolchain
    # line in go.mod, so only patch and digest updates are automatic.
    ignore:
      - dependency-name: library/golang
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(actions)" }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    # whatsmeow is tracked by the weekly upgrade-check job instead.
    ignore:
      - dependency-name: go.mau.fi/whatsmeow
