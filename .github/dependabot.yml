version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    # whatsmeow is tracked by the weekly upgrade-check job instead.
    ignore:
      - dependency-name: go.mau.fi/whatsmeow
