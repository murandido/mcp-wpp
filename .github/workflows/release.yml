name: Publish container image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # Nothing is published unless the full test stage passes for this tag.
  test:
    name: Test stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target test -t wpp-mcp:test .

  build:
    name: Build and push ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/murandido/mcp-wpp
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/murandido/mcp-wpp:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/murandido/mcp-wpp:buildcache-${{ matrix.arch }},mode=max
          # Keep the runtime apt-get update/upgrade fresh on each release.
          no-cache-filters: runtime
          sbom: true
          provenance: mode=max

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/murandido/mcp-wpp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish multi-platform manifest
        env:
          IMAGE: ghcr.io/murandido/mcp-wpp
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(printf '%s\n' "$TAGS" | awk 'NF && !seen[$0]++')
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          if ((${#tag_args[@]} == 0)); then
            echo "No image tags generated for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:${version}-amd64" \
            "$IMAGE:${version}-arm64"
