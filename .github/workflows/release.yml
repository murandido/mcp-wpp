name: Publish container image

on:
  push:
    tags: ['v*']

# Each job asks for what it needs; nothing is granted by default.
permissions: {}

jobs:
  # Nothing is published unless the full test stage passes for this tag.
  test:
    name: Test stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target test -t wpp-mcp:test .

  build:
    name: Build and push ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/murandido/mcp-wpp
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/murandido/mcp-wpp:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/murandido/mcp-wpp:buildcache-${{ matrix.arch }},mode=max
          # Keep the runtime apt-get update/upgrade fresh on each release.
          no-cache-filters: runtime
          sbom: true
          provenance: mode=max

  # Publishes the multi-platform index, then signs it and its platform
  # images with cosign keyless (a Fulcio certificate for this workflow,
  # issued through GitHub OIDC, logged in Rekor) and attaches an SPDX SBOM
  # attestation to each platform image. Everything is addressed by digest,
  # never by tag, so a moved tag cannot redirect a signature.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/murandido/mcp-wpp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish multi-platform manifest
        id: publish
        env:
          IMAGE: ghcr.io/murandido/mcp-wpp
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(printf '%s\n' "$TAGS" | awk 'NF && !seen[$0]++')
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          if ((${#tag_args[@]} == 0)); then
            echo "No image tags generated for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:${version}-amd64" \
            "$IMAGE:${version}-arm64"

          # The digest of the index just pushed, and of its platform images
          # (attestation manifests have platform unknown/unknown).
          manifest=$(docker buildx imagetools inspect "$IMAGE:${version}" --format '{{json .Manifest}}')
          digest=$(jq -r '.digest' <<<"$manifest")
          amd64=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' <<<"$manifest")
          arm64=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")][0].digest' <<<"$manifest")
          for d in "$digest" "$amd64" "$arm64"; do
            if [[ ! "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "unexpected digest '$d' for $IMAGE:${version}" >&2
              exit 1
            fi
          done
          {
            echo "digest=$digest"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image index and its platform images
        env:
          IMAGE: ghcr.io/murandido/mcp-wpp
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"

      - name: SBOM for linux/amd64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/murandido/mcp-wpp@${{ steps.publish.outputs.amd64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM for linux/arm64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/murandido/mcp-wpp@${{ steps.publish.outputs.arm64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOMs
        env:
          IMAGE: ghcr.io/murandido/mcp-wpp
          AMD64: ${{ steps.publish.outputs.amd64 }}
          ARM64: ${{ steps.publish.outputs.arm64 }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom-amd64.spdx.json "$IMAGE@$AMD64"
          cosign attest --yes --type spdxjson --predicate sbom-arm64.spdx.json "$IMAGE@$ARM64"
