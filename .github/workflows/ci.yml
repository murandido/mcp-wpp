name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  schedule:
    - cron: '17 6 * * 1'  # weekly whatsmeow upgrade probe

permissions:
  contents: read

# Supersede in-flight runs when a branch gets a newer push; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install SQLCipher and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev ffmpeg
      - run: go mod download
      - name: Lint (go vet + gofmt)
        run: make lint
      - name: Unit tests (race, coverage)
        run: make test-cover
      - name: Smoke test (encrypted store)
        run: make smoke
      - name: End-to-end tests
        run: make e2e
      - name: Tool reference is up to date
        run: make docs && git diff --exit-code docs/tools.md
      - name: mdtest parity grep
        # Fails if a whatsmeow method we call disappears upstream — an early
        # signal that the API was removed or renamed.
        run: bash ./scripts/mdtest-parity.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    # The image is the main distribution channel; make sure it still builds
    # and its full test stage passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t wpp-mcp:test .

  upgrade-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install SQLCipher and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev ffmpeg
      - name: Record pinned version
        run: echo "OLD_PIN=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)" >> "$GITHUB_ENV"
      - run: go get go.mau.fi/whatsmeow@main
      - run: go mod tidy
      - name: Record upstream version
        run: echo "NEW_PIN=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)" >> "$GITHUB_ENV"
      - run: make build test
      - name: Record build/test status
        if: always()
        run: echo "STATUS=${{ job.status }}" >> "$GITHUB_ENV"
      - name: Report bump to rolling issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${OLD_PIN:-}" ] || [ -z "${NEW_PIN:-}" ]; then
            echo "version check did not complete; skipping report"
            exit 0
          fi
          if [ "$OLD_PIN" = "$NEW_PIN" ]; then
            echo "whatsmeow already current, nothing to report"
            exit 0
          fi
          body="whatsmeow can be bumped.

          - Current pin: \`$OLD_PIN\`
          - Upstream @main: \`$NEW_PIN\`
          - Build and test against @main: $STATUS

          Run \`go get go.mau.fi/whatsmeow@main && go mod tidy\` to accept."
          num=$(gh issue list --label upstream --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "whatsmeow upstream update available" --label upstream --body "$body"
          fi
